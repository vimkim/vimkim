name: Update project dates

on:
  schedule:
    - cron: "17 18 * * 0" # Monday 03:17 KST (Sunday 18:17 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update_project_dates.py
      - scripts/test_update_project_dates.py
      - .github/workflows/project-dates.yml

permissions:
  contents: write

concurrency:
  group: project-dates
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROFILE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Check updater
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh project dates
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PAT must allow reading every listed project, including private repositories."
            exit 1
          fi
          python3 -B scripts/update_project_dates.py
      - name: Commit updated dates
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'docs(readme): refresh project update dates'
          git pull --rebase origin "$PROFILE_BRANCH"
          git push origin "HEAD:$PROFILE_BRANCH"
